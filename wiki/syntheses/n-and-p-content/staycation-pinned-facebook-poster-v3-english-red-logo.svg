<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">N&amp;P Muaythai Camp Staycation Poster V3 English Red Logo</title>
  <desc id="desc">English square Facebook pinned poster for Muay Thai staycation with red and gold styling matching N&amp;P rate-card posts and official logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b001c"/>
      <stop offset="0.52" stop-color="#760014"/>
      <stop offset="1" stop-color="#b30724"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.48" stop-color="#ffd44f"/>
      <stop offset="1" stop-color="#eea51c"/>
    </linearGradient>
    <linearGradient id="deepRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d71935"/>
      <stop offset="1" stop-color="#870015"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="82%" cy="12%" r="42%">
      <stop offset="0" stop-color="#ffd766" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#ffd766" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="12%" cy="88%" r="38%">
      <stop offset="0" stop-color="#ffd766" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd766" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scratch" width="190" height="190" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)">
      <path d="M18 18 L152 15 M42 70 L175 62 M10 128 L96 120 M120 154 L178 148" stroke="#ffffff" stroke-width="2" opacity="0.075" stroke-linecap="round"/>
      <path d="M35 106 L150 98 M70 34 L130 30" stroke="#ffd45a" stroke-width="1.5" opacity="0.08" stroke-linecap="round"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#250008" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#250008" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="logoClip"><rect x="72" y="48" width="150" height="180" rx="10"/></clipPath>
    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .impact { font-family: Impact, 'Arial Black', Arial, sans-serif; letter-spacing: 1px; }
      .cream { fill: #fff7e3; }
      .gold { fill: #ffd452; }
      .goldFill { fill: url(#gold); }
      .navy { fill: #082447; }
      .red { fill: #a5001d; }
      .muted { fill: #ffe9ad; }
      .smallcap { font-weight: 850; letter-spacing: 3px; }
      .heavy { font-weight: 950; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glowTop)"/>
  <rect width="1080" height="1080" fill="url(#glowBottom)"/>
  <rect width="1080" height="1080" fill="url(#scratch)"/>
  <rect x="42" y="42" width="996" height="996" rx="34" fill="none" stroke="#ffe7a0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- P.PAO-IN logo (top right) -->
  <g transform="translate(858 48)" filter="url(#softShadow)">
    <!-- backing tile -->
    <rect width="160" height="160" rx="14" fill="#7a0014"/>
    <rect width="160" height="160" rx="14" fill="none" stroke="#ffe7a0" stroke-opacity="0.55" stroke-width="2"/>

    <!-- boxing ring -->
    <g>
      <!-- back posts -->
      <rect x="53" y="32" width="5" height="46" fill="#0a0a0a"/>
      <rect x="102" y="32" width="5" height="46" fill="#0a0a0a"/>
      <!-- front posts (taller, in front) -->
      <rect x="20" y="28" width="7" height="60" fill="#0a0a0a"/>
      <rect x="133" y="28" width="7" height="60" fill="#0a0a0a"/>

      <!-- back ropes -->
      <line x1="55" y1="38" x2="105" y2="38" stroke="#0a0a0a" stroke-width="2.5"/>
      <line x1="55" y1="48" x2="105" y2="48" stroke="#0a0a0a" stroke-width="2.5"/>
      <line x1="55" y1="58" x2="105" y2="58" stroke="#0a0a0a" stroke-width="2.5"/>
      <line x1="55" y1="68" x2="105" y2="68" stroke="#0a0a0a" stroke-width="2.5"/>

      <!-- left perspective ropes -->
      <line x1="22" y1="34" x2="55" y2="38" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="22" y1="48" x2="55" y2="48" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="22" y1="62" x2="55" y2="58" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="22" y1="76" x2="55" y2="68" stroke="#0a0a0a" stroke-width="3"/>

      <!-- right perspective ropes -->
      <line x1="138" y1="34" x2="105" y2="38" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="138" y1="48" x2="105" y2="48" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="138" y1="62" x2="105" y2="58" stroke="#0a0a0a" stroke-width="3"/>
      <line x1="138" y1="76" x2="105" y2="68" stroke="#0a0a0a" stroke-width="3"/>

      <!-- white rope tape segments -->
      <g fill="#ffffff">
        <rect x="76" y="36" width="8" height="4.5"/>
        <rect x="76" y="46" width="8" height="4.5"/>
        <rect x="76" y="56" width="8" height="4.5"/>
        <rect x="76" y="66" width="8" height="4.5"/>
        <rect x="36" y="42" width="7" height="3.5"/>
        <rect x="36" y="56" width="7" height="3.5"/>
        <rect x="36" y="70" width="7" height="3.5"/>
        <rect x="117" y="42" width="7" height="3.5"/>
        <rect x="117" y="56" width="7" height="3.5"/>
        <rect x="117" y="70" width="7" height="3.5"/>
      </g>
    </g>

    <!-- white outer hex border -->
    <polygon points="12,88 30,76 130,76 148,88 148,140 130,152 30,152 12,140" fill="#ffffff"/>
    <!-- blue badge -->
    <polygon points="17,90 33,80 127,80 143,90 143,138 127,148 33,148 17,138" fill="#1f3f6e"/>

    <!-- three stars -->
    <g fill="#ffffff">
      <polygon points="68,89 69.4,92.5 73.2,92.5 70.1,94.7 71.3,98.2 68,96 64.7,98.2 65.9,94.7 62.8,92.5 66.6,92.5"/>
      <polygon points="80,86 81.7,90.5 86.4,90.5 82.6,93.3 84.1,97.8 80,95.0 75.9,97.8 77.4,93.3 73.6,90.5 78.3,90.5"/>
      <polygon points="92,89 93.4,92.5 97.2,92.5 94.1,94.7 95.3,98.2 92,96 88.7,98.2 89.9,94.7 86.8,92.5 90.6,92.5"/>
    </g>

    <!-- decorative lines beside the stars -->
    <line x1="34" y1="94" x2="58" y2="94" stroke="#ffffff" stroke-width="1.6"/>
    <line x1="102" y1="94" x2="126" y2="94" stroke="#ffffff" stroke-width="1.6"/>

    <!-- main wordmark -->
    <text x="80" y="121" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#ffffff">P.PAO-IN</text>

    <!-- side dots for MUAYTHAI -->
    <circle cx="29" cy="131" r="1.6" fill="#ffffff"/>
    <circle cx="131" cy="131" r="1.6" fill="#ffffff"/>

    <text x="80" y="134" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="2.6">MUAYTHAI</text>
    <text x="80" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600" fill="#ffffff" letter-spacing="1.5">2009</text>
  </g>

  <!-- real logo -->
  <image href="../../../raw/assets/IMG_7270.PNG" x="72" y="48" width="150" height="180" preserveAspectRatio="xMidYMid meet" clip-path="url(#logoClip)"/>

  <!-- brand header -->
  <text x="250" y="89" class="sans cream smallcap" font-size="22">N&amp;P MUAYTHAI CAMP</text>
  <text x="250" y="124" class="sans muted" font-size="22" font-weight="750">RAMA 2, BANGKOK</text>
  <rect x="250" y="148" width="310" height="50" rx="15" fill="#ffffff" fill-opacity="0.14" stroke="#ffd452" stroke-opacity="0.58"/>
  <text x="405" y="181" text-anchor="middle" class="sans cream smallcap" font-size="21">MUAY THAI STAYCATION</text>

  <!-- headline -->
  <text x="72" y="315" class="impact goldFill" font-size="104" filter="url(#softShadow)">
    <tspan x="72" dy="0">EAT.</tspan>
    <tspan x="72" dy="92">SLEEP.</tspan>
    <tspan x="72" dy="92">TRAIN.</tspan>
    <tspan x="72" dy="92">REPEAT.</tspan>
  </text>

  <!-- subhead -->
  <rect x="610" y="256" width="350" height="250" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="785" y="310" text-anchor="middle" class="sans navy heavy" font-size="31">LIVE THE MUAY THAI</text>
  <text x="785" y="350" text-anchor="middle" class="sans navy heavy" font-size="31">LIFESTYLE</text>
  <line x1="668" y1="382" x2="902" y2="382" stroke="#d4a33c" stroke-width="2"/>
  <text x="785" y="426" text-anchor="middle" class="sans red" font-size="24" font-weight="850">Fighter-led training</text>
  <text x="785" y="461" text-anchor="middle" class="sans red" font-size="24" font-weight="850">On-site stay</text>
  <text x="785" y="496" text-anchor="middle" class="sans red" font-size="24" font-weight="850">Daily meals</text>

  <!-- feature cards with fixed overflow -->
  <g class="sans" filter="url(#shadow)">
    <rect x="72" y="704" width="222" height="104" rx="20" fill="#fff"/>
    <text x="94" y="746" class="navy heavy" font-size="24">2x Training</text>
    <text x="94" y="779" fill="#a5001d" font-size="18" font-weight="750">Morning + evening</text>

    <rect x="314" y="704" width="222" height="104" rx="20" fill="#fff"/>
    <text x="336" y="746" class="navy heavy" font-size="24">On-site Stay</text>
    <text x="336" y="779" fill="#a5001d" font-size="18" font-weight="750">Recover nearby</text>

    <rect x="556" y="704" width="222" height="104" rx="20" fill="#fff"/>
    <text x="578" y="742" class="navy heavy" font-size="22">Breakfast</text>
    <text x="578" y="769" class="navy heavy" font-size="22">+ Dinner</text>
    <text x="578" y="794" fill="#a5001d" font-size="17" font-weight="750">Daily meals included</text>

    <rect x="798" y="704" width="210" height="104" rx="20" fill="#fff"/>
    <text x="820" y="746" class="navy heavy" font-size="23">All Levels</text>
    <text x="820" y="779" fill="#a5001d" font-size="18" font-weight="750">Beginner to pro</text>
  </g>

  <!-- price cards -->
  <g filter="url(#shadow)">
    <rect x="72" y="840" width="420" height="112" rx="30" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="100" y="877" class="sans red smallcap" font-size="17">PER DAY</text>
    <text x="100" y="936" class="impact navy" font-size="61">1,000</text>
    <text x="294" y="935" class="sans navy heavy" font-size="25">THB</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="840" width="488" height="112" rx="30" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="548" y="877" class="sans red smallcap" font-size="17">PER MONTH</text>
    <text x="548" y="936" class="impact navy" font-size="61">25,000</text>
    <text x="790" y="935" class="sans navy heavy" font-size="25">THB</text>
  </g>

  <!-- CTA/contact; separated so it does not overflow -->
  <text x="72" y="998" class="sans cream heavy" font-size="24">
    <tspan>Line: </tspan><tspan class="gold">@ppaoin</tspan><tspan>  |  Call: </tspan><tspan class="gold">081-445-5844</tspan>
  </text>
  <text x="1008" y="998" text-anchor="end" class="sans gold heavy" font-size="22">MESSAGE TO CONFIRM DATES</text>
  <text x="540" y="1032" text-anchor="middle" class="sans" font-size="15" fill="#fff7e3" fill-opacity="0.68">Package details and availability should be confirmed before booking. Location: Rama 2, Bangkok, Thailand.</text>
</svg>
