<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070604"/>
      <stop offset="0.48" stop-color="#17110d"/>
      <stop offset="1" stop-color="#080705"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e03128"/>
      <stop offset="1" stop-color="#8d1410"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="18%" r="45%">
      <stop offset="0" stop-color="#e2b954" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e2b954" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="16%" r="42%">
      <stop offset="0" stop-color="#d4261f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d4261f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff4d4" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#d4261f" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .cream { fill: #f8f2df; }
      .muted { fill: #d9c08a; }
      .gold { fill: #e2b954; }
      .redtext { fill: #d4261f; }
      .smallcap { font-weight: 850; letter-spacing: 3px; }
      .heavy { font-weight: 950; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow1)"/>
  <rect width="1080" height="1080" fill="url(#glow2)"/>
  <rect width="1080" height="1080" fill="url(#grid)" opacity="0.75"/>

  <rect x="42" y="42" width="996" height="996" rx="34" fill="none" stroke="#f8f2df" stroke-opacity="0.24" stroke-width="2"/>

  <text x="72" y="96" class="sans muted smallcap" font-size="24">N&amp;P MUAYTHAI CAMP</text>
  <rect x="774" y="66" width="234" height="48" rx="24" fill="#000" fill-opacity="0.28" stroke="#e2b954" stroke-opacity="0.72" stroke-width="1.5"/>
  <text x="891" y="98" text-anchor="middle" class="sans gold smallcap" font-size="18">RAMA 2, BANGKOK</text>

  <g opacity="0.30">
    <circle cx="842" cy="405" r="178" fill="none" stroke="#d4261f" stroke-width="28"/>
    <circle cx="842" cy="405" r="137" fill="none" stroke="#e2b954" stroke-opacity="0.65" stroke-width="12"/>
  </g>
  <text x="1022" y="135" writing-mode="tb" class="sans heavy" font-size="92" fill="none" stroke="#f8f2df" stroke-opacity="0.12" stroke-width="2">MUAY THAI</text>

  <rect x="74" y="133" width="300" height="52" rx="14" fill="#d4261f" fill-opacity="0.20"/>
  <text x="94" y="168" class="sans cream smallcap" font-size="22">MUAY THAI STAYCATION</text>

  <text x="72" y="275" class="sans cream heavy" font-size="110" letter-spacing="-5">
    <tspan x="72" dy="0">EAT.</tspan>
    <tspan x="72" dy="96">SLEEP.</tspan>
    <tspan x="72" dy="96" class="redtext">TRAIN.</tspan>
    <tspan x="72" dy="96">REPEAT.</tspan>
  </text>

  <text x="74" y="634" class="sans cream heavy" font-size="32">
    <tspan x="74" dy="0">Live the Muay Thai lifestyle with fighter-led</tspan>
    <tspan x="74" dy="38">training, on-site stay, and daily meals.</tspan>
  </text>

  <g class="sans">
    <rect x="74" y="704" width="224" height="102" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#f8f2df" stroke-opacity="0.18"/>
    <text x="94" y="744" class="cream heavy" font-size="25">2x Training / Day</text>
    <text x="94" y="774" fill="#f8f2df" fill-opacity="0.70" font-size="16" font-weight="650">Morning &amp; evening sessions</text>

    <rect x="316" y="704" width="224" height="102" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#f8f2df" stroke-opacity="0.18"/>
    <text x="336" y="744" class="cream heavy" font-size="25">On-site Stay</text>
    <text x="336" y="774" fill="#f8f2df" fill-opacity="0.70" font-size="16" font-weight="650">Recover close to the gym</text>

    <rect x="558" y="704" width="224" height="102" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#f8f2df" stroke-opacity="0.18"/>
    <text x="578" y="744" class="cream heavy" font-size="25">Breakfast &amp; Dinner</text>
    <text x="578" y="774" fill="#f8f2df" fill-opacity="0.70" font-size="16" font-weight="650">Daily meals included</text>

    <rect x="800" y="704" width="206" height="102" rx="22" fill="#ffffff" fill-opacity="0.055" stroke="#f8f2df" stroke-opacity="0.18"/>
    <text x="820" y="744" class="cream heavy" font-size="25">Beginner to Pro</text>
    <text x="820" y="774" fill="#f8f2df" fill-opacity="0.70" font-size="16" font-weight="650">All levels welcome</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="842" width="382" height="112" rx="30" fill="url(#red)"/>
    <text x="98" y="876" class="sans cream smallcap" font-size="17" fill-opacity="0.78">PER DAY</text>
    <text x="98" y="934" class="sans cream heavy" font-size="58" letter-spacing="-2">1,000</text>
    <text x="284" y="934" class="sans cream heavy" font-size="24" fill-opacity="0.82">THB</text>
  </g>

  <rect x="480" y="842" width="382" height="112" rx="30" fill="#000" fill-opacity="0.40" stroke="#e2b954" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="504" y="876" class="sans cream smallcap" font-size="17" fill-opacity="0.78">PER MONTH</text>
  <text x="504" y="934" class="sans cream heavy" font-size="58" letter-spacing="-2">25,000</text>
  <text x="730" y="934" class="sans cream heavy" font-size="24" fill-opacity="0.82">THB</text>

  <text x="74" y="1000" class="sans cream heavy" font-size="23">
    <tspan>Line: </tspan><tspan class="gold">@ppaoin</tspan><tspan>  |  Call: </tspan><tspan class="gold">081-445-5844</tspan>
  </text>
  <text x="1006" y="1000" text-anchor="end" class="sans cream heavy" font-size="25">MESSAGE US TO CONFIRM DATES</text>

  <text x="74" y="1030" class="sans" font-size="14" fill="#f8f2df" fill-opacity="0.52">Package details and availability should be confirmed before booking. Location: Rama 2, Bangkok, Thailand.</text>
</svg>
